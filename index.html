
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrafficVision AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
</head>
<body class="bg-dark text-white">

    <main class="container py-5">
        <h1 class="mb-4">TrafficVision AI</h1>

        <div class="mb-3">
            <label for="video-input" class="form-label">
                Selecione um vídeo
            </label>

            <input
                type="file"
                id="video-input"
                class="form-control"
                accept="video/*"
            />
        </div>

        <div class="ratio ratio-16x9 bg-black rounded overflow-hidden">
            <video
                id="source-video"
                controls
                playsinline
            ></video>
        </div>

        <p id="status" class="mt-3 text-secondary">
            Aguardando vídeo...
        </p>
    </main>

    <script type="module" src="/src/js/main.js"></script>

</body>
</html>
